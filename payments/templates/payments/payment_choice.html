{% extends 'base.html' %}
{% load static %}

{% block title %}Payer la cotisation - AMEEK{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Paiement de la cotisation</h2>
    <p class="text-gray-500 mt-1">Choisissez votre mode de paiement en ligne</p>
  </div>

  <form method="get" action="{% url 'payments:paytech_checkout' %}">
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <label for="montant" class="block text-gray-700 font-medium mb-1">Montant (FCFA)</label>
      <input type="number" name="montant" id="montant" min="1" step="1" required
             value="{{ montant|default:'' }}" placeholder="Ex : 5000"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amicale focus:border-transparent">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <button type="submit" name="method" value="wave"
              class="block w-full bg-white rounded-xl shadow-md hover:shadow-lg transition border-2 border-transparent hover:border-[#00A2E8] p-6 text-center group">
        <div class="w-24 h-24 mx-auto mb-4 flex items-center justify-center">
          <img src="{% static 'img/wave-logo.webp' %}" alt="Wave"
               class="max-w-full max-h-full object-contain">
        </div>
        <h4 class="font-bold text-gray-800 text-lg">Wave</h4>
        <p class="text-sm text-gray-500 mt-1">Payer avec Wave</p>
      </button>

      <button type="submit" name="method" value="orange_money"
              class="block w-full bg-white rounded-xl shadow-md hover:shadow-lg transition border-2 border-transparent hover:border-orange-500 p-6 text-center group">
        <div class="w-24 h-24 mx-auto mb-4 flex items-center justify-center">
          <img src="{% static 'img/orange-money-logo.png' %}" alt="Orange Money"
               class="max-w-full max-h-full object-contain">
        </div>
        <h4 class="font-bold text-gray-800 text-lg">Orange Money</h4>
        <p class="text-sm text-gray-500 mt-1">Payer avec Orange Money</p>
      </button>
    </div>

    <div class="text-center">
      <button type="submit" name="method" value=""
              class="text-sm text-gray-400 hover:text-amicale underline">
        Autres moyens de paiement (Carte bancaire, Free Money, etc.)
      </button>
    </div>
  </form>

  <div class="mt-6 text-center">
    <a href="{% url 'payments:list' %}" class="text-gray-500 hover:text-gray-700 text-sm">Retour</a>
  </div>
</div>
{% endblock %}
